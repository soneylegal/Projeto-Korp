---
- name: Provisiona o ambiente do desafio Korp (http-server-projeto-korp)
  hosts: korp
  become: true

  vars:
    project_dir: /opt/projeto-korp
    project_repo: "https://github.com/soneylegal/projeto-korp.git"
    docker_network_name: korp-net

  tasks:
    # --- instalação do Docker ---

    - name: Instalar dependências base (git, pip, requisitos do repo do Docker)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - python3-pip
        state: present
        update_cache: true

    - name: Criar diretório de keyrings do apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar o repositório apt do Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine e o plugin de Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Garantir que o serviço docker está ativo e habilitado no boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Instalar o SDK Python do Docker (usado pelos módulos community.docker)
      ansible.builtin.pip:
        name: docker
        state: present
        executable: pip3

    # --- código do projeto ---

    - name: Clonar/atualizar o repositório do projeto
      ansible.builtin.git:
        repo: "{{ project_repo }}"
        dest: "{{ project_dir }}"
        version: main
        force: true
      # o repo já traz consigo a config do nginx (nginx/http-server-projeto-korp.conf)
      # e o provisionamento do Grafana/Prometheus — cloná-lo já deixa os dois "configurados".

    # --- rede Docker ---

    - name: Criar a rede Docker em modo bridge
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        driver: bridge
        state: present

    # --- containers (serviço + nginx + monitoramento) ---

    - name: Build das imagens e subida dos containers via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        build: always
        state: present

    - name: Aguardar o nginx responder na porta 80
      ansible.builtin.wait_for:
        port: 80
        timeout: 30

    # --- validação ---

    - name: Validar o serviço com uma requisição HTTP real
      ansible.builtin.uri:
        url: "http://localhost/projeto-korp"
        return_content: true
      register: projeto_korp_response

    - name: Exibir a resposta no console
      ansible.builtin.debug:
        msg: "{{ projeto_korp_response.content }}"
